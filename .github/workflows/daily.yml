name: Daily IPTV
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge DSJ all channels and other listed channels
        shell: python
        run: |
          import hashlib
          import json
          import os
          import re
          import unicodedata
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path
          
          CATEGORIES = [('cctv', '央视'), ('local', '地方台'), ('hmt', '港澳台频道'), ('international', '国际频道'), ('other', '其他')]
          
          def normalize(name):
              name = unicodedata.normalize('NFKC', name).strip()
              name = re.sub(r'\s*\((?:\d+[pi]|[248]K)\)\s*$', '', name, flags=re.I)
              name = re.sub(r'\s*(?:超高清|超清|高清|FHD|HD)$', '', name, flags=re.I).strip()
              match = re.fullmatch(r'(CCTV|CETV)\s*-?\s*(\d+)(\+)?(?:\s+.*|[-—].*)?', name, re.I)
              if match:
                  name = match[1].upper() + match[2] + (match[3] or '')
              return {'文化精品': '央视文化精品', '翡翠台': 'TVB翡翠台', '凤凰中文台': '凤凰中文', '凤凰资讯台': '凤凰资讯', '凤凰香港台': '凤凰香港'}.get(name, name)
          
          def key(name):
              return re.sub(r'\s+', '', normalize(name)).casefold()
          
          def parse(text):
              lines = text.lstrip('\ufeff').splitlines()
              if lines and lines[0].strip().startswith('#EXTM3U'):
                  pending = None
                  for line in lines[1:]:
                      line = line.strip()
                      if line.startswith('#EXTINF:'):
                          pending = line
                      elif line and not line.startswith('#'):
                          if pending and ',' in pending:
                              meta, name = pending.rsplit(',', 1)
                              match = re.search(r'group-title="([^"]*)"', meta)
                              attrs = re.findall(r'(?:tvg-)?(country|language)="([^"]*)"', meta, re.I)
                              hint = ' '.join([match[1] if match else '']+[k.lower()+':'+v for k,v in attrs])
                              yield name.strip(), line, meta, hint
                          pending = None
              else:
                  group = ''
                  for line in lines:
                      if ',' not in line:
                          continue
                      name, urls = line.split(',', 1)
                      if urls.strip().lower() == '#genre#':
                          group = name.strip()
                          continue
                      for url in urls.split('#'):
                          yield name.strip(), url.split('$', 1)[0].strip(), '#EXTINF:-1', group
          
          def classify(name, hints, preferred):
              listed = preferred.get(key(name))
              if listed in {'cctv', 'local', 'hmt'}:
                  return listed
              # Region and language are inferred from names and upstream metadata.
              h = ' '.join(hints)
              if re.search(r'CCTV|CETV|CGTN|CHC|NewTV|iHOT|TVB|ViuTV|RTHK|HOY|NowTV|翡翠|凤凰|鳳凰|无线|無線|东森|東森|民视|民視|三立|纬来|緯來|八大|靖天|靖洋|龙华|龍華|台视|台視|华视|華視|公视|公視|中视|中視|澳视|澳視', name, re.I):
                  return 'other'
              domestic = r'中国|中國|大陆|大陸|港澳台|香港|澳门|澳門|台湾|台灣|国语|國語|汉语|漢語|中文|华语|華語|粤语|粵語|闽南|閩南|客家|四川话|东北话|Chinese|Mandarin|Cantonese|Hokkien|Hakka|Hong Kong|Taiwan|Macau|China|country:(?:CN|HK|MO|TW)(?:$| )|language:(?:zh|zho|chi|yue|nan|hak)(?:$| )'
              if re.search(domestic, name, re.I) or re.search(r'country:(?:CN|HK|MO|TW)(?:$| )|language:(?:zh|zho|chi|yue|nan|hak)(?:$| )', h, re.I):
                  return 'other'
              if re.search(r'BBC|CNN|NHK|KBS|MBC|SBS|Arirang|Al Jazeera|France 24|DW News|TV5MONDE|RAI|Rai |RTR|俄罗斯|俄羅斯|韩国|韓國|朝鲜|朝鮮|日本|美国|美國|英国|英國|法国|法國|德国|德國|泰国|泰國|越南|印度|阿拉伯', name, re.I):
                  return 'international'
              if re.search(domestic, h, re.I):
                  return 'other'
              if re.search(r'[\u3400-\u9fff]', name):
                  return 'other'
              return 'international'
          
          def merge(resources, groups):
              preferred = {key(n):g['file'] for g in groups for n in g['channels']}
              canonical = {key(n):n for g in groups for n in g['channels']}
              channels = {}
              stats = []
              for label, text, include_all in resources:
                  stat = {'source':label, 'scope':'all' if include_all else 'channel-list', 'entries':0, 'added':0, 'duplicates':0, 'invalid':0, 'filtered':0}
                  for original, url, meta, group in parse(text):
                      name = normalize(original)
                      if not name or not re.fullmatch(r'(?:https?|rtsp|rtmp|udp|rtp)://[^\s]+', url, re.I):
                          stat['invalid'] += 1
                          continue
                      stat['entries'] += 1
                      ident = key(name)
                      if not include_all and ident not in preferred:
                          stat['filtered'] += 1
                          continue
                      item = channels.setdefault(ident, {'name':canonical.get(ident, name), 'hints':[], 'lines':[], 'seen':set()})
                      if group and group not in item['hints']:
                          item['hints'].append(group)
                      if url in item['seen']:
                          stat['duplicates'] += 1
                      else:
                          item['seen'].add(url)
                          meta = re.sub(r'\s+group-title="[^"]*"', '', meta)
                          item['lines'].append((meta, url))
                          stat['added'] += 1
                  if not stat['entries']:
                      raise ValueError('No valid entries: '+label)
                  stats.append(stat)
              if not channels:
                  raise ValueError('No channels; retain previous playlists')
              rank = {key(n):i for i,n in enumerate(n for g in groups for n in g['channels'])}
              output = {k:[] for k,_ in CATEGORIES}
              for ident,item in channels.items():
                  category = classify(item['name'], item['hints'], preferred)
                  output[category].append((rank.get(ident, 1000000), ident, item))
              rendered = {}
              counts = {}
              combined = []
              for slug,label in CATEGORIES:
                  records = []
                  for _,ident,item in sorted(output[slug], key=lambda x:(x[0],x[1])):
                      for meta,url in item['lines']:
                          records.extend([meta+' group-title="'+label+'",'+item['name'], url])
                  rendered[slug] = '\n'.join(['#EXTM3U']+records)+'\n'
                  combined.extend(records)
                  counts[slug] = {'channels':len(output[slug]), 'lines':len(records)//2}
              rendered['all'] = '\n'.join(['#EXTM3U']+combined)+'\n'
              return rendered, {'sources':stats, 'total_channels':len(channels), 'new_channels':sum(k not in preferred for k in channels), 'total_lines':len(combined)//2, 'categories':counts}
          
          def main():
              report = {'time':datetime.now(timezone.utc).isoformat(), 'status':'retained', 'policy':'dsj-all-other-sources-channel-list-five-categories'}
              for d in ['reports','playlists']:
                  Path(d).mkdir(exist_ok=True)
              try:
                  config = json.loads(Path('config/sources.json').read_text(encoding='utf-8'))
                  groups = json.loads(Path('config/channel-order.json').read_text(encoding='utf-8'))
                  resources = []
                  hashes = {}
                  for source in config['sources']:
                      if not source.get('enabled', True):
                          continue
                      targets = source.get('urls') or [source.get('url') or source['path']]
                      for target in targets:
                          label = source['name']+' / '+target.rsplit('/',1)[-1]
                          if '://' in target:
                              request = urllib.request.Request(target, headers={'User-Agent':'my-tv-sources/4.0'})
                              with urllib.request.urlopen(request, timeout=30) as response:
                                  data = response.read(12000001)
                          else:
                              data = Path(target).read_bytes()
                          if len(data)>12000000:
                              raise ValueError('Source exceeds 12MB: '+label)
                          text = data.decode('utf-8-sig')
                          if target.endswith(('.m3u','.m3u8')) and not text.lstrip().startswith('#EXTM3U'):
                              raise ValueError('Invalid M3U header: '+label)
                          resources.append((label, text, source['name'] == 'bang359/dsj'))
                          hashes[target] = hashlib.sha256(data).hexdigest()
                  rendered, details = merge(resources, groups)
                  for slug,text in rendered.items():
                      temporary = Path('playlists/'+slug+'.m3u.tmp')
                      temporary.write_text(text, encoding='utf-8')
                  for slug in rendered:
                      os.replace('playlists/'+slug+'.m3u.tmp','playlists/'+slug+'.m3u')
                  for obsolete in ['satellite', 'kids', 'sports', 'movies']:
                      Path('playlists/'+obsolete+'.m3u').unlink(missing_ok=True)
                  Path('reports/source-state.json').write_text(json.dumps(hashes,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  Path('config/update-policy.json').write_text(json.dumps({'all_channels_sources':['bang359/dsj'],'other_sources_scope':'config/channel-order.json','preferred_order':'config/channel-order.json','categories':dict(CATEGORIES),'deduplicate':'normalized channel name + exact URL','on_source_failure':'retain previous complete playlists'},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
                  report.update(status='published', **details)
                  links = '\n'.join('|'+label+'|https://raw.githubusercontent.com/nut7nan/my-tv-sources/main/playlists/'+slug+'.m3u|' for slug,label in [('all','全部')]+CATEGORIES)
                  names = '\n'.join('- '+s['name']+': '+', '.join(s.get('urls') or [s.get('url') or s.get('path')]) for s in config['sources'] if s.get('enabled',True))
                  Path('README.md').write_text('# 我的电视直播源\n\n每天北京时间 **06:23**（UTC cron `23 22 * * *`，GitHub 可能延迟）读取下列配置来源。\n\n## 更新原则\n\n仅 bang359/dsj 的六个频道TXT全量收录有效频道；CCSH、Guovin、Best-fan和用户附件仍只收录原清单中的频道（沿用Excel及之后用户调整后的135台清单）。DSJ可补入清单外频道，包括新增港澳台频道。频道名称做保守规范化（CCTV/CETV连字符、常见清晰度后缀及少量明确别名）；同频道相同URL去重，不同URL保留多线路。无法确认同名关系时保留独立频道，避免错合并。\n\n`config/channel-order.json` 是非DSJ来源的频道允许名单，同时用于所有来源的原频道优先排序及分类。只有匹配清单央视、地方台、港澳台名称的频道进入这三个分类，保持清单顺序。其余频道中，中国地区、港澳台地区或汉语（包括方言）频道归“其他”；其余归“国际频道”。新增港澳台频道归其他，不再加入港澳台分类。地区及语言根据名称、上游分组与可用元数据推断，可能误判；无法确认地区/语言的拉丁字母名称暂归国际频道。\n\n仅发布央视、地方台、港澳台、国际频道、其他五类及总表；旧satellite/kids/sports/movies分类文件停止发布，请改用总表或上述分类。\n\n## 订阅直链\n\n|分类|原始文件链接|\n|---|---|\n'+links+'\n\n在“我要看电视”APK中刷新订阅即可获取仓库新内容，具体受APK缓存影响。总表已包含全部分类，建议只订阅总表避免重复。\n\n## 当前来源\n\n'+names+'\n\n来源配置在 `config/sources.json`，每日直接读取其中启用的url/urls/path；新增TXT文件需要加入配置。用户附件 `config/supplemental.m3u` 为固定副本。DSJ六个TXT按“频道名,地址”解析，跳过分组及公告，不追踪sources.txt中的二级来源。\n\n## 运行与失败处理\n\nActions → Daily IPTV → Run workflow → main → Run workflow 可手动运行。每个远程文件30秒超时、12MB上限，顺序抓取；检查格式和HTTP(S)/RTSP/RTMP/UDP/RTP地址，任一来源下载失败、解析失败或没有有效频道时，保留上一次完整播放列表并记录失败。全部解析、合并完成后才发布。报告见 `reports/latest.json`，列出每个来源的有效条目、新增、重复及无效条目，以及各分类频道数和线路数。\n\n工作流只使用schedule和workflow_dispatch触发；GITHUB_TOKEN仅申请contents: write，自动提交使用[skip ci]，不会循环触发。若写入失败，请检查仓库Actions权限和分支规则。\n\n## 局限与来源限制\n\n合并成功不代表视频可播放；此任务不逐条播放探测，不依据GitHub服务器连接结果剔除线路。地域、运营商、鉴权、时效、防盗链及播放器差异可能影响国内无代理播放。\n\nCCSH、Guovin、Best-fan、DSJ及用户附件的公开链接或代码许可证不等于逐条直播流已获播放、复制或再分发授权；未核实逐流授权。请遵守各上游说明及权利人限制，在相应许可范围内使用。\n', encoding='utf-8')
              except Exception as error:
                  report['reason'] = str(error)
              Path('reports/latest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              Path('reports/outcome.txt').write_text('success' if report['status']=='published' else 'failure')
              print(json.dumps(report,ensure_ascii=False))
          
          if __name__ == '__main__':
              main()
      - name: Publish playlists and report
        run: |
          cat reports/latest.json >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md config playlists reports/latest.json reports/source-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update DSJ all and listed source channels [skip ci]'
            git push
          fi
          test "$(cat reports/outcome.txt)" = success


