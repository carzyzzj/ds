name: Daily IPTV
on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: iptv
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract ordered CCSH channels
        shell: python
        run: |
          import json,re,urllib.request,hashlib
          from pathlib import Path
          from datetime import datetime,timezone
          for d in ['config','playlists','reports']: Path(d).mkdir(exist_ok=True)
          source='https://raw.githubusercontent.com/CCSH/IPTV/refs/heads/main/live.m3u'
          defaults=[
              ('cctv','央视','CCTV1|CCTV2|CCTV3|CCTV4|CCTV4K|CCTV5|CCTV5+|CCTV6|CCTV7|CCTV8|CCTV8K|CCTV9|CCTV10|CCTV11|CCTV12|CCTV13|CCTV14|CCTV15|CCTV16|CCTV17|兵器科技|第一剧场|电视指南|发现之旅|风云剧场|风云音乐|风云足球|高尔夫网球|怀旧剧场|老故事|女性时尚|世界地理|卫生健康|央视台球|央视文化精品'),
              ('local','地方台','安徽卫视|北京卫视|东方影视|中国蓝新闻|兵团卫视|全纪实|大湾区卫视|内蒙农牧|东方卫视|内蒙少儿|内蒙文体|内蒙经济|东南卫视|北京体育休闲|福建海峡卫视|北京新闻|北京生活|北京科教|北京财经|北京青年|甘肃卫视|广东卫视|广西卫视|贵州卫视|海南卫视|天津|海峡卫视|天津文艺|天津新闻|天津都市|河北卫视|河南卫视|黑龙江卫视|湖北卫视|湖南卫视|吉林卫视|江苏卫视|江西卫视|康巴卫视|辽宁卫视|南方卫视|内蒙古卫视|宁夏卫视|农林卫视|青海卫视|浙江国际|浙江少儿|浙江影视|浙江教科|浙江教科影视|浙江教科影院|浙江教育|浙江数码时代|浙江新闻|三沙卫视|厦门卫视|山东卫视|山西卫视|陕西卫视|深圳卫视|四川卫视|天津卫视|西藏卫视|新疆卫视|延边卫视|云南卫视|浙江卫视|重庆卫视'),
              ('hmt','港澳台频道','HBO|TVBJ2|TVBPearl|TVBPlus|TVBS|TVBS亚洲|TVBS新闻台|TVB星河|TVB翡翠台|ViuTV|三立台湾台|三立戏剧|三立新闻台|三立综合台|三立都会台|东森幼幼台|东森戏剧台|东森新闻台|东森洋片台|东森电影台|东森综合台|东森美洲卫视|东森财经新闻台|东森超视|中天亚洲台|中天娱乐台|中天新闻台|中天综合台|中视|中视新闻|中视经典|中视经典综艺|中视菁采台|八大娱乐台|八大戏剧台|八大第一台|八大精彩台|八大综合台|八大综艺台|公视|公视台语台|公视戏剧|凤凰中文|凤凰资讯|凤凰香港|华视|华视新闻|台视|台视新闻台|无线新闻|星空卫视|民视|民视台湾台|民视影剧台|民视新闻台|民视旅游台|民视第一台|民视综艺台|纬来体育台|纬来戏剧台|纬来日本台|纬来电影台|纬来精彩台|纬来综合台|靖天卡通台|靖天戏剧台|靖天日本台|靖天映画|靖天电影台|靖天综合台|靖天育乐台|靖天资讯台|靖洋戏剧台|香港卫视|龙华偶像|龙华卡通|龙华戏剧|龙华洋片|龙华电影|龙华经典'),
              ('international','国际频道',''),
              ('other','其它','CETV1|CETV2|CETV3|CETV4|CHC动作电影|CHC家庭影院|CHC影迷电影|CN卡通|五星体育|人与自然|动物世界|动物星球|劲爆体育|卡酷少儿|广东体育')]
          order_path=Path('config/channel-order.json')
          if not order_path.exists():
              order_path.write_text(json.dumps([{'file':k,'name':g,'channels':names.split('|') if names else []} for k,g,names in defaults],ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          groups=json.loads(order_path.read_text(encoding='utf-8'))
          Path('config/sources.json').write_text(json.dumps({'schema_version':6,'sources':[{'name':'CCSH/IPTV','url':source,'enabled':True,'rights_status':'Public links; personal noncommercial use; broadcast rights not certified'},{'name':'User IPv4 supplement','path':'config/supplemental.m3u','enabled':True,'rights_status':'User supplied; broadcast rights not certified'},{'name':'Guovin IPv4','url':'https://guovin.github.io/iptv-api/ipv4.m3u','enabled':True,'rights_status':'Public playlist; stream redistribution rights not certified'}]},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          report={'time':datetime.now(timezone.utc).isoformat(),'source':source,'status':'retained','missing':[]}
          failed=False
          try:
              request=urllib.request.Request(source,headers={'User-Agent':'my-tv-sources/3.0'})
              with urllib.request.urlopen(request,timeout=30) as r: body=r.read(12000001)
              if len(body)>12000000: raise ValueError('Source exceeds 12MB')
              lines=body.decode('utf-8-sig').splitlines()
              if not lines or not lines[0].startswith('#EXTM3U'): raise ValueError('Invalid M3U header')
              wanted={n for g in groups for n in g['channels']}
              found={n:[] for n in wanted}; seen={n:set() for n in wanted}
              pending=None; parsed=0
              for line in lines[1:]:
                  line=line.strip()
                  if line.startswith('#EXTINF:'): pending=line
                  elif line and not line.startswith('#'):
                      if pending and ',' in pending and re.fullmatch(r'https?://[^\s]+',line):
                          name=pending.rsplit(',',1)[1].strip(); parsed+=1
                          if name in wanted and line not in seen[name]:
                              seen[name].add(line)
                              meta=re.sub(r'\s+group-title="[^"]*"','',pending.rsplit(',',1)[0])
                              found[name].append((meta,line))
                      pending=None
              if not parsed: raise ValueError('No valid source entries')
              supplemental=Path('config/supplemental.m3u').read_text(encoding='utf-8-sig').splitlines()
              if not supplemental or not supplemental[0].startswith('#EXTM3U'): raise ValueError('Invalid supplemental M3U header')
              extra={'entries':0,'added':0,'duplicates':0,'unmatched':[]}; pending=None
              for line in supplemental[1:]:
                  line=line.strip()
                  if line.startswith('#EXTINF:'): pending=line
                  elif line and not line.startswith('#'):
                      if pending and ',' in pending and re.fullmatch(r'https?://[^\s]+',line):
                          original=pending.rsplit(',',1)[1].strip(); name=original
                          match=re.fullmatch(r'CCTV-?(\d+)(\+)?(?:\s+.*)?',original,re.I)
                          if match: name='CCTV'+match[1]+(match[2] or '')
                          extra['entries']+=1
                          if name not in wanted:
                              if original not in extra['unmatched']: extra['unmatched'].append(original)
                          elif line in seen[name]: extra['duplicates']+=1
                          else:
                              seen[name].add(line)
                              meta=re.sub(r'\s+group-title="[^"]*"','',pending.rsplit(',',1)[0])
                              found[name].append((meta,line)); extra['added']+=1
                      pending=None
              report['supplemental']=extra
              remote_url='https://guovin.github.io/iptv-api/ipv4.m3u'
              remote_request=urllib.request.Request(remote_url,headers={'User-Agent':'my-tv-sources/3.1'})
              with urllib.request.urlopen(remote_request,timeout=30) as r: remote_body=r.read(12000001)
              if len(remote_body)>12000000: raise ValueError('Guovin source exceeds 12MB')
              remote_lines=remote_body.decode('utf-8-sig').splitlines()
              if not remote_lines or not remote_lines[0].startswith('#EXTM3U'): raise ValueError('Invalid Guovin M3U header')
              remote={'url':remote_url,'entries':0,'added':0,'duplicates':0,'matched_channels':[],'unmatched':[]}; pending=None
              for line in remote_lines[1:]:
                  line=line.strip()
                  if line.startswith('#EXTINF:'): pending=line
                  elif line and not line.startswith('#'):
                      if pending and ',' in pending and re.fullmatch(r'https?://[^\s]+',line):
                          original=pending.rsplit(',',1)[1].strip(); name=original
                          match=re.fullmatch(r'(CCTV|CETV)-?(\d+)(\+)?(?:\s+.*)?',original,re.I)
                          if match: name=match[1].upper()+match[2]+(match[3] or '')
                          name={'文化精品':'央视文化精品'}.get(name,name)
                          remote['entries']+=1
                          if name not in wanted:
                              if original not in remote['unmatched']: remote['unmatched'].append(original)
                          else:
                              if name not in remote['matched_channels']: remote['matched_channels'].append(name)
                              if line in seen[name]: remote['duplicates']+=1
                              else:
                                  seen[name].add(line)
                                  meta=re.sub(r'\s+group-title="[^"]*"','',pending.rsplit(',',1)[0])
                                  found[name].append((meta,line)); remote['added']+=1
                      pending=None
              if not remote['entries']: raise ValueError('No valid Guovin source entries')
              remote['matched_channels']=len(remote['matched_channels'])
              report['guovin']=remote
              rendered={}; combined=[]; counts={}; matched=0
              for group in groups:
                  records=[]
                  for name in group['channels']:
                      if not found[name]: report['missing'].append({'category':group['name'],'channel':name})
                      else: matched+=1
                      for meta,url in found[name]: records.extend([meta+' group-title="'+group['name']+'",'+name,url])
                  counts[group['file']]={'requested':len(group['channels']),'matched':sum(bool(found[n]) for n in group['channels']),'lines':len(records)//2}
                  rendered[group['file']]='\n'.join(['#EXTM3U']+records)+'\n'
                  combined.extend(records)
              if not combined: raise ValueError('No requested channels found; retaining previous version')
              rendered['all']='\n'.join(['#EXTM3U']+combined)+'\n'
              for key,text in rendered.items(): Path('playlists/'+key+'.m3u').write_text(text,encoding='utf-8')
              for p in Path('playlists').glob('*.m3u'):
                  if p.stem not in rendered: p.unlink()
              Path('reports/source-state.json').write_text(json.dumps({'source':source,'sha256':hashlib.sha256(body).hexdigest()},indent=2)+'\n')
              report.update(status='published',source_entries=parsed,requested_channels=sum(len(g['channels']) for g in groups),matched_channels=matched,total_lines=len(combined)//2,categories=counts)
          except Exception as error:
              failed=True; report['reason']=str(error)
          Path('reports/latest.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('reports/outcome.txt').write_text('failure' if failed else 'success')
          print(json.dumps(report,ensure_ascii=False))
      - name: Publish playlists and report
        run: |
          cat reports/latest.json >> "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config playlists reports/latest.json reports/source-state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update ordered CCSH channels [skip ci]'
            git push
          fi
          test "$(cat reports/outcome.txt)" = success


